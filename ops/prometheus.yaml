global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs: [{targets: [alertmanager:9093]}]
scrape_configs:
  - job_name: applytrack-api
    static_configs: [{targets: [api:8000]}]
  - job_name: applytrack-checker
    static_configs: [{targets: [runtime:9000]}]
