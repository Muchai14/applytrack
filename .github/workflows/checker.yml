name: Independent cloud availability check
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-checker
  cancel-in-progress: false
jobs:
  check:
    if: vars.CLOUD_CHECKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt
      - name: Check impact and run the constrained responder
        working-directory: backend
        env:
          API_URL: ${{ vars.RENDER_DEV_URL }}
          DATABASE_URL: ${{ secrets.CHECKER_DATABASE_URL }}
          OPS_TOKEN: ${{ secrets.DEV_OPS_TOKEN }}
          DB_SCHEMA: applytrack_dev
          APP_ENV: dev
        run: python -m app.runtime --once
